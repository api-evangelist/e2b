  name: E2B Sandbox API
  description: >-
    The E2B Sandbox API creates and controls per-agent Linux microVMs that can run arbitrary code, install
    packages, read and write files, stream terminal output, and host headless browsers. Code Interpreter
    is a higher-level surface tuned for LLM-driven Python and JavaScript execution with rich outputs.
